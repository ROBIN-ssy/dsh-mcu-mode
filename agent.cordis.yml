# 「单片机模式」agent preset —— 本机自建模式（用户预设，id: mcu）
#
# 它等于 `standard`（标准模式）的全部能力，另加三层：
#   1. 单片机人格：先确认型号、按型号谈时钟/引脚/外设、硬件安全优先、可复制的编译烧录命令。
#   2. 单片机档案（本预设自带插件 `./plugin/mcu-registry.mjs`）：
#      - 把本会话绑定的型号/工程/功能注入系统提示（每个对话都知道自己用的是哪颗芯片）；
#      - 绑定时把会话标题改成「型号 · 功能」，在对话列表里一眼可见；
#      - 型号库 + 使用档案写到 $DSH_HOME/mcu/registry.json 与 REGISTRY.md；
#      - 给模型 5 个工具：mcu_bind / mcu_status / mcu_note / mcu_list / mcu_catalog_set。
#   3. 预设自带 skills 目录：./skills/ 下的 SKILL.md 随本预设一起走，新增 skill 会被
#      skill-filesystem 的 watcher 实时发现（$DSH_HOME/skills 里的全局 skill 也照常可见）。
#
# 这是 AGENT 平面的组合：本文件由 dsh-agent-presets 在进程内挂载一次，所有选用本模式的
# 会话共享这一个实例（插件内部按 session id 区分状态）。HOST 平面仍然拥有注册表本身：
# tools / systemPrompt / skills / sessions / 沙箱与审批栈 / 模型路由。
#
# 本文件是「输入，不是持久化目标」：dsh 不会把它当配置写回，升级也不会覆盖它（它属于你）。
# 行内用到的服务都来自 HOST 平面；本预设不 publish 任何服务，所以不需要 isolate realm。

# ── 身份 ────────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

      你现在处于「单片机模式」：专注单片机 / 嵌入式固件开发（重点 STM32 F1/F4/H7，工具链 Keil MDK5 与 STM32CubeIDE / CubeMX + GCC）。用中文回答；型号、寄存器与位域名、外设实例、命令、代码保持英文。

      工作习惯：
      - 进工程先扫描，不要先猜：第一步调用 mcu_scan（不带参数扫当前工作区；工程在别处就传 path）。它会把型号、工具链、固件库、外设、引脚连同「哪个文件给出了什么值」一起列出来；型号明确时会自动绑定本会话，并更新会话标题。
      - 扫描之后必须把证据摊开给用户看：用「文件 → 关键值 → 结论」的形式讲清工程里的具体信息（型号、工具链、库类型、用到哪些外设与引脚、时钟与存储配置），再谈方案。
      - 涉及型号 / 引脚 / 外设 / 寄存器的任何结论都要有依据：写清来自哪个文件、哪个值。工程里找不到依据的，就明确说"工程里没有找到"，绝不用别的型号的记忆补。
      - 不清楚本会话绑定的是哪颗，就先 mcu_status 查；没有绑定就先 mcu_scan（必要时 mcu_bind），不要带着模糊型号往下写代码。
      - 改代码前先看工程结构和既有写法（HAL / LL / 标准库 SPL / 寄存器直写、中断还是轮询），沿用同一套风格，不顺手引入新抽象层。
      - 硬件安全优先：涉及电源、时钟、看门狗、Flash 擦写、BOOT 引脚、启动模式、烧录与调试接口时，说明风险、后果和验证步骤。
      - 编译 / 烧录 / 串口调试要给出可复制的完整命令（含路径与参数），并说明哪一步可能失败、如何判断成功。
      - 每完成一项有意义的固件工作（外设点亮、驱动调通、协议实现、踩坑修复、构建脚本），调用 mcu_note 记一条；记录要具体到外设实例与关键参数。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` 留在 HOST 平面（apps/cli 注入 DSH_WEB_URL/DSH_WEB_MODE）；预设只决定本
# 会话能不能用 shell 工具，执行器本身是 host 平面的。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── 文件系统 ────────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 后台任务 ────────────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# skill 注册表在 HOST 平面并按 scope 分层；这两行注册进「本预设这一层」。
# `customSkillDirs` 用预设自己的目录：baseUrl 就是本预设目录，所以 ./skills/ 随预设
# 一起走、复制预设时一起搬。includeDefaultRoots 保持默认 true，于是工程目录里的
# .dsh/skills、.agents/skills 和 $DSH_HOME/skills 也照常被发现。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 单片机档案 ──────────────────────────────────────────────────────────────

# 本预设自带插件（相对路径 -> 从本预设目录解析；裸包名 -> 从 harness 安装目录解析）。
# 它只注册工具和一段系统提示段落，不 publish 服务，因此不需要 realm。
#
# ⚠️ 插件文件**自己的** import 只能写 node: 内置模块或相对路径（见 plugin/mcu-registry.mjs 文件头）：
#    预设目录上方没有 node_modules，`import '@deepseek-ai/…'` 会让这一行导入失败，
#    进而整个预设挂载失败（agent-preset-invalid），表现就是「点新会话没反应」。
#    参数/出参 schema 因此手写在插件里的**原始 JSON Schema**，入参校验也由插件自己做。
#
# 配置项见 plugin/mcu-registry.mjs 的 DEFAULTS：dataDir / renameSessionTitle /
# promptSection / promptSectionOrder / seedCatalog / historyLimit / recentNotes /
# titleMaxBytes / autoBindOnScan / probeInSection / probeCacheSeconds。dataDir 省略即 $DSH_HOME/mcu。
- id: mcu-registry
  name: './plugin/mcu-registry.mjs'
  config:
    # 绑定时把会话标题改成「型号 · 功能」，方便在对话列表里认出每个对话用的单片机。
    renameSessionTitle: true
    # 把本会话绑定的型号注入系统提示（每个对话都知道自己用的是哪颗芯片）。
    promptSection: true
    # 段落顺序：0 是部署人格，100-199 是工具说明；90 让它排在工具说明之前。
    promptSectionOrder: 90
    # 第一次运行时用本预设的 catalog.seed.json 初始化型号库。
    seedCatalog: true
    # mcu_scan 扫到明确型号且本会话未绑定时自动绑定（不指望模型自觉去绑）。
    autoBindOnScan: true
    # 未绑定会话里，在系统提示中内联一次工作区廉价探测的结果（型号/工具链/库 + 前几条依据）。
    probeInSection: true
    probeCacheSeconds: 30
    historyLimit: 400
    recentNotes: 3
    # 会话标题的字节预算：要小于本部署 session-title 的 maxTitleBytes（dsh-base 里是 80）。
    titleMaxBytes: 72

# ── 目标 ────────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── 计划模式 ────────────────────────────────────────────────────────────────

# 计划状态天然属于单个 agent，所以 entry-local realm 是正确的生命周期。
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── 压缩 ────────────────────────────────────────────────────────────────────

# compaction-basic 通过 ctx.get 读 toolResultPruner，所以两者要同 realm；
# tokenMeter 故意留在 HOST 平面（它拥有 context-meter 投影单元，是进程级的）。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 委派与工作流 ────────────────────────────────────────────────────────────

# subagents 注册表与它的 spawn/fork 后端在 HOST 平面（进程单例、名字全局唯一）；
# 本预设只提供「面向模型的委派工具」。workflows 引擎没有 agent 之外的使用者，
# 所以凡是碰它的行共享本预设自己的 entry-local realm。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # 本部署没有安装这两个可选后端；装了对应 Bundle 之后，复制本预设并去掉 disabled 才生效。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── 其余面向模型的行 ────────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
